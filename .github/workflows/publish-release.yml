name: Publish verified release archive

on:
  push:
    branches: ["codex/publish-v1.1.0"]

permissions:
  contents: write

concurrency:
  group: publish-v1.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.1.0
      ASSET: DSH-AutoRoboMaster-v1.1.0-win-x64.zip
      RELEASE_COMMIT: 8573c539f5ae5c4168baaaae5163d9573ec1947c
      PREVIOUS_MAIN: 640687489f72647d967fc04b326a89e8ee9e2dea
      RELEASE_TITLE: "DSH AutoRoboMaster v1.1.0 · Windows x64"
    steps:
      - name: Stage and verify the release
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet
          git fetch --quiet --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          mkdir -p release-files verify
          git show "FETCH_HEAD:release-payload/$ASSET" > "release-files/$ASSET"
          git show "FETCH_HEAD:release-payload/$ASSET.sha256" > "release-files/$ASSET.sha256"
          git show FETCH_HEAD:release-payload/notes.md > release-files/notes.md
          (cd release-files && sha256sum -c "$ASSET.sha256")
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$head" = "$PREVIOUS_MAIN" || test "$head" = "$RELEASE_COMMIT"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file release-files/notes.md
          fi
          target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          test "$target" = "$RELEASE_COMMIT"
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$draft" = true ]; then
            uploaded="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for file in "$ASSET" "$ASSET.sha256"; do
              if ! grep -Fxq -- "$file" <<< "$uploaded"; then
                gh release upload "$TAG" "release-files/$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --pattern "$ASSET.sha256" --dir verify
          cmp "release-files/$ASSET.sha256" "verify/$ASSET.sha256"
          (cd verify && sha256sum -c "$ASSET.sha256")
          if [ "$draft" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$published" = "$RELEASE_COMMIT"
